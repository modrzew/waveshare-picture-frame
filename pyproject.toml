[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "waveshare-picture-frame"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "paho-mqtt>=2.1.0",
    "pillow>=13.0.0",
    "requests>=2.33.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
rpi = ["RPi.GPIO", "spidev"]
jetson = ["Jetson.GPIO"]

[dependency-groups]
dev = ["ruff>=0.8.4", "pyright>=1.1.390"]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["src/vendor/waveshare_epd"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
exclude = ["src/vendor/waveshare_epd", ".venv"]

# 32-bit Raspberry Pi (e.g. Pi Zero W): PyPI has no armv6l/armv7l wheels for these, so take
# prebuilt ones from piwheels instead of compiling from source. Other platforms use PyPI.
[[tool.uv.index]]
name = "piwheels"
url = "https://www.piwheels.org/simple"
explicit = true

[tool.uv.sources]
numpy = { index = "piwheels", marker = "platform_machine == 'armv6l' or platform_machine == 'armv7l'" }
pillow = { index = "piwheels", marker = "platform_machine == 'armv6l' or platform_machine == 'armv7l'" }
